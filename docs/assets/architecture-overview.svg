<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="kafkaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#231F20"/>
      <stop offset="100%" style="stop-color:#4a4a4a"/>
    </linearGradient>
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ADD8"/>
      <stop offset="100%" style="stop-color:#0095c7"/>
    </linearGradient>
    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3776AB"/>
      <stop offset="100%" style="stop-color:#FFD43B"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#336791"/>
      <stop offset="100%" style="stop-color:#2d5a7b"/>
    </linearGradient>
    <linearGradient id="redisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DC382D"/>
      <stop offset="100%" style="stop-color:#b52d24"/>
    </linearGradient>
    <linearGradient id="mongoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#47A248"/>
      <stop offset="100%" style="stop-color:#3d8b3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead-white" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a202c">Realtime Event Platform Architecture</text>

  <!-- Frontend Layer -->
  <rect x="400" y="60" width="400" height="60" rx="10" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="600" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Frontend Dashboard</text>
  <text x="600" y="112" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">React / Next.js / ECharts</text>

  <!-- Arrow from Frontend to Gateway -->
  <line x1="600" y1="120" x2="600" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="610" y="140" font-size="10" fill="#666">WebSocket / REST</text>

  <!-- API Gateway -->
  <rect x="350" y="155" width="500" height="50" rx="8" fill="#4a5568" filter="url(#shadow)"/>
  <text x="600" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="white">API Gateway (NGINX / Kong / Traefik)</text>

  <!-- Arrows from Gateway to Services -->
  <line x1="450" y1="205" x2="200" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="205" x2="600" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="750" y1="205" x2="1000" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Top Services Row -->
  <!-- Query Service -->
  <rect x="100" y="255" width="200" height="70" rx="8" fill="url(#goGrad)" filter="url(#shadow)"/>
  <text x="200" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Query Service</text>
  <text x="200" y="302" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">Read APIs / Aggregations</text>
  <text x="200" y="316" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.6)">Go + GORM + Redis</text>

  <!-- Auth Service -->
  <rect x="500" y="255" width="200" height="70" rx="8" fill="url(#goGrad)" filter="url(#shadow)"/>
  <text x="600" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Auth Service</text>
  <text x="600" y="302" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">JWT / RBAC / OAuth2</text>
  <text x="600" y="316" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.6)">Go + Keycloak</text>

  <!-- WebSocket Gateway -->
  <rect x="900" y="255" width="200" height="70" rx="8" fill="url(#goGrad)" filter="url(#shadow)"/>
  <text x="1000" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="white">WebSocket Gateway</text>
  <text x="1000" y="302" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">Live Streaming</text>
  <text x="1000" y="316" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.6)">Go + Gorilla WS</text>

  <!-- Arrows to Kafka -->
  <line x1="200" y1="325" x2="200" y2="380" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1000" y1="325" x2="1000" y2="380" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Kafka Layer -->
  <rect x="100" y="385" width="1000" height="70" rx="10" fill="url(#kafkaGrad)" filter="url(#shadow)"/>
  <text x="600" y="420" text-anchor="middle" font-size="18" font-weight="bold" fill="white">Apache Kafka</text>
  <text x="600" y="442" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">Event Streaming | Message Broker | Topics: raw | processed | predictions | alerts | analytics</text>

  <!-- Arrows from Kafka to Processing Services -->
  <line x1="250" y1="455" x2="200" y2="510" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="455" x2="600" y2="510" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="950" y1="455" x2="1000" y2="510" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Processing Services Row -->
  <!-- Collector Service -->
  <rect x="50" y="515" width="200" height="100" rx="8" fill="url(#goGrad)" filter="url(#shadow)"/>
  <text x="150" y="545" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Collector Service</text>
  <text x="150" y="565" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">Event Ingestion</text>
  <text x="150" y="580" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.6)">WebSocket Input</text>
  <text x="150" y="595" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.6)">API Polling</text>
  <text x="150" y="610" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">Go + Gin + kafka-go</text>

  <!-- Analytics Service -->
  <rect x="300" y="515" width="200" height="100" rx="8" fill="url(#goGrad)" filter="url(#shadow)"/>
  <text x="400" y="545" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Analytics Service</text>
  <text x="400" y="565" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">Stream Processing</text>
  <text x="400" y="580" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.6)">Rolling Statistics</text>
  <text x="400" y="595" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.6)">Anomaly Detection</text>
  <text x="400" y="610" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">Go + TimescaleDB</text>

  <!-- Prediction Service -->
  <rect x="550" y="515" width="200" height="100" rx="8" fill="url(#pythonGrad)" filter="url(#shadow)"/>
  <text x="650" y="545" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Prediction Service</text>
  <text x="650" y="565" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.9)">ML Inference</text>
  <text x="650" y="580" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">XGBoost / LSTM</text>
  <text x="650" y="595" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">Confidence Scoring</text>
  <text x="650" y="610" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Python + FastAPI + PyTorch</text>

  <!-- Alert Service -->
  <rect x="800" y="515" width="200" height="100" rx="8" fill="url(#goGrad)" filter="url(#shadow)"/>
  <text x="900" y="545" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Alert Service</text>
  <text x="900" y="565" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">Threshold Monitoring</text>
  <text x="900" y="580" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.6)">Telegram / Discord</text>
  <text x="900" y="595" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.6)">Email Notifications</text>
  <text x="900" y="610" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">Go + SMTP</text>

  <!-- Arrows to Data Layer -->
  <line x1="150" y1="615" x2="150" y2="680" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="615" x2="400" y2="680" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="615" x2="650" y2="680" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="615" x2="900" y2="680" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Data Layer Background -->
  <rect x="50" y="685" width="1100" height="120" rx="10" fill="#e2e8f0" filter="url(#shadow)"/>
  <text x="100" y="710" font-size="12" font-weight="bold" fill="#4a5568">Data Layer</text>

  <!-- Redis -->
  <rect x="100" y="720" width="180" height="70" rx="8" fill="url(#redisGrad)" filter="url(#shadow)"/>
  <text x="190" y="752" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Redis</text>
  <text x="190" y="772" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">Cache / Pub-Sub / Sessions</text>

  <!-- PostgreSQL -->
  <rect x="330" y="720" width="220" height="70" rx="8" fill="url(#dbGrad)" filter="url(#shadow)"/>
  <text x="440" y="752" text-anchor="middle" font-size="14" font-weight="bold" fill="white">PostgreSQL</text>
  <text x="440" y="772" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">TimescaleDB / Events / Users</text>

  <!-- MongoDB -->
  <rect x="600" y="720" width="180" height="70" rx="8" fill="url(#mongoGrad)" filter="url(#shadow)"/>
  <text x="690" y="752" text-anchor="middle" font-size="14" font-weight="bold" fill="white">MongoDB</text>
  <text x="690" y="772" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">Documents / Logs</text>

  <!-- Observability -->
  <rect x="830" y="720" width="280" height="70" rx="8" fill="#805AD5" filter="url(#shadow)"/>
  <text x="970" y="745" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Observability Stack</text>
  <text x="970" y="765" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Prometheus | Grafana | Loki | Jaeger</text>
  <text x="970" y="780" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">OpenTelemetry | Distributed Tracing</text>

  <!-- Event Flow Arrows (curved) -->
  <path d="M 250 565 Q 275 490 400 515" fill="none" stroke="#38a169" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <path d="M 500 565 Q 575 490 650 515" fill="none" stroke="#38a169" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <path d="M 750 565 Q 825 490 900 515" fill="none" stroke="#38a169" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <rect x="50" y="825" width="300" height="60" rx="5" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="845" font-size="11" font-weight="bold" fill="#4a5568">Legend</text>
  <rect x="60" y="855" width="12" height="12" fill="#00ADD8"/>
  <text x="78" y="865" font-size="10" fill="#4a5568">Go Service</text>
  <rect x="140" y="855" width="12" height="12" fill="#3776AB"/>
  <text x="158" y="865" font-size="10" fill="#4a5568">Python Service</text>
  <line x1="230" y1="861" x2="260" y2="861" stroke="#38a169" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="268" y="865" font-size="10" fill="#4a5568">Event Flow</text>

  <!-- Tech badges -->
  <text x="1100" y="860" text-anchor="end" font-size="10" fill="#718096">Go 1.26+ | Python 3.11+ | Kafka | K8s | Docker</text>
</svg>
