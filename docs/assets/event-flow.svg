<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ADD8"/>
      <stop offset="100%" style="stop-color:#0095c7"/>
    </linearGradient>
    <linearGradient id="kafkaGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#231F20"/>
      <stop offset="100%" style="stop-color:#4a4a4a"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78"/>
      <stop offset="100%" style="stop-color:#38a169"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ed8936"/>
      <stop offset="100%" style="stop-color:#dd6b20"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38a169"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4299e1"/>
    </marker>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="300" fill="#f7fafc"/>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2d3748">Event Processing Flow</text>

  <!-- Row 1: Ingestion Flow -->
  <text x="50" y="70" font-size="12" font-weight="bold" fill="#718096">INGESTION</text>

  <!-- Event Source -->
  <rect x="50" y="85" width="100" height="50" rx="6" fill="url(#purpleGrad)" filter="url(#shadow2)"/>
  <text x="100" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Event Source</text>

  <line x1="150" y1="110" x2="190" y2="110" stroke="#38a169" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Collector -->
  <rect x="195" y="85" width="110" height="50" rx="6" fill="url(#blueGrad)" filter="url(#shadow2)"/>
  <text x="250" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Collector</text>
  <text x="250" y="122" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Service</text>

  <line x1="305" y1="110" x2="345" y2="110" stroke="#38a169" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kafka Raw -->
  <rect x="350" y="85" width="100" height="50" rx="6" fill="url(#kafkaGrad2)" filter="url(#shadow2)"/>
  <text x="400" y="107" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Kafka</text>
  <text x="400" y="122" text-anchor="middle" font-size="9" fill="#ff6b6b">events.raw</text>

  <line x1="450" y1="110" x2="490" y2="110" stroke="#38a169" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Analytics -->
  <rect x="495" y="85" width="110" height="50" rx="6" fill="url(#blueGrad)" filter="url(#shadow2)"/>
  <text x="550" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Analytics</text>
  <text x="550" y="122" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Service</text>

  <line x1="605" y1="110" x2="645" y2="110" stroke="#38a169" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kafka Processed -->
  <rect x="650" y="85" width="100" height="50" rx="6" fill="url(#kafkaGrad2)" filter="url(#shadow2)"/>
  <text x="700" y="107" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Kafka</text>
  <text x="700" y="122" text-anchor="middle" font-size="9" fill="#48bb78">events.processed</text>

  <line x1="750" y1="110" x2="790" y2="110" stroke="#38a169" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Prediction -->
  <rect x="795" y="85" width="110" height="50" rx="6" fill="url(#orangeGrad)" filter="url(#shadow2)"/>
  <text x="850" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Prediction</text>
  <text x="850" y="122" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Service (ML)</text>

  <line x1="905" y1="110" x2="945" y2="110" stroke="#38a169" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kafka Predictions -->
  <rect x="950" y="85" width="100" height="50" rx="6" fill="url(#kafkaGrad2)" filter="url(#shadow2)"/>
  <text x="1000" y="107" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Kafka</text>
  <text x="1000" y="122" text-anchor="middle" font-size="9" fill="#667eea">events.predictions</text>

  <!-- Row 2: Delivery Flow -->
  <text x="50" y="175" font-size="12" font-weight="bold" fill="#718096">DELIVERY</text>

  <!-- Kafka Alerts -->
  <rect x="350" y="190" width="100" height="50" rx="6" fill="url(#kafkaGrad2)" filter="url(#shadow2)"/>
  <text x="400" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Kafka</text>
  <text x="400" y="227" text-anchor="middle" font-size="9" fill="#fc8181">events.alerts</text>

  <line x1="350" y1="215" x2="310" y2="215" stroke="#4299e1" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Alert Service -->
  <rect x="195" y="190" width="110" height="50" rx="6" fill="url(#blueGrad)" filter="url(#shadow2)"/>
  <text x="250" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Alert</text>
  <text x="250" y="227" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Service</text>

  <line x1="195" y1="215" x2="155" y2="215" stroke="#4299e1" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Notifications -->
  <rect x="50" y="190" width="100" height="50" rx="6" fill="url(#greenGrad)" filter="url(#shadow2)"/>
  <text x="100" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="white">Notifications</text>
  <text x="100" y="227" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.8)">TG / Discord / Email</text>

  <!-- WebSocket Gateway -->
  <rect x="495" y="190" width="110" height="50" rx="6" fill="url(#blueGrad)" filter="url(#shadow2)"/>
  <text x="550" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="white">WebSocket</text>
  <text x="550" y="227" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Gateway</text>

  <line x1="450" y1="215" x2="490" y2="215" stroke="#4299e1" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="605" y1="215" x2="645" y2="215" stroke="#4299e1" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Dashboard -->
  <rect x="650" y="190" width="100" height="50" rx="6" fill="url(#purpleGrad)" filter="url(#shadow2)"/>
  <text x="700" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Dashboard</text>
  <text x="700" y="227" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">Realtime UI</text>

  <!-- Vertical connections -->
  <line x1="1000" y1="135" x2="1000" y2="160" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="1000" y1="160" x2="400" y2="160" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="400" y1="160" x2="400" y2="185" stroke="#666" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow-blue)"/>

  <!-- Legend -->
  <rect x="850" y="180" width="200" height="55" rx="4" fill="white" stroke="#e2e8f0"/>
  <text x="860" y="198" font-size="10" font-weight="bold" fill="#4a5568">Legend</text>
  <line x1="860" y1="210" x2="890" y2="210" stroke="#38a169" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="895" y="214" font-size="9" fill="#4a5568">Ingestion</text>
  <line x1="960" y1="210" x2="990" y2="210" stroke="#4299e1" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="995" y="214" font-size="9" fill="#4a5568">Delivery</text>
  <line x1="860" y1="225" x2="890" y2="225" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="895" y="229" font-size="9" fill="#4a5568">Internal routing</text>
</svg>
