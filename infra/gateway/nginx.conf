upstream collector_service {
    server collector-service:8080;
}

upstream analytics_service {
    server analytics-service:8080;
}

upstream prediction_service {
    server prediction-service:8080;
}

upstream query_service {
    server query-service:8080;
}

upstream auth_service {
    server auth-service:8080;
}

upstream alert_service {
    server alert-service:8080;
}

upstream websocket_gateway {
    server websocket-gateway:8080;
}

server {
    listen 80;
    server_name api.event-platform.local;

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location /api/v1/events {
        proxy_pass http://collector_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/analytics {
        proxy_pass http://analytics_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/predictions {
        proxy_pass http://prediction_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/query {
        proxy_pass http://query_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/auth {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/alerts {
        proxy_pass http://alert_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://websocket_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}
