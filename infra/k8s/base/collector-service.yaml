apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-service
  namespace: event-platform
  labels:
    app: collector-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: collector-service
  template:
    metadata:
      labels:
        app: collector-service
    spec:
      containers:
        - name: collector-service
          image: event-platform/collector-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: event-platform-config
            - secretRef:
                name: event-platform-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: collector-service
  namespace: event-platform
spec:
  selector:
    app: collector-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
